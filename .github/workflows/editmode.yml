# EditMode tests of the client in GameCI on Linux (Unity Personal). Run by hand, and by release.yml (DIST-10) before
# a draft release. Results: the editmode-results artifact and the totals in the log. Secrets: UNITY_LICENSE,
# UNITY_EMAIL, UNITY_PASSWORD.
name: EditMode
on:
  workflow_dispatch:
  workflow_call:
    secrets:
      UNITY_LICENSE:
        required: true
      UNITY_EMAIL:
        required: true
      UNITY_PASSWORD:
        required: true
# Read-only token.
permissions:
  contents: read
jobs:
  editmode:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Disk space and swap for the Unity image
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo fallocate -l 8G /mnt/wotr.swap && sudo chmod 600 /mnt/wotr.swap
          sudo mkswap /mnt/wotr.swap >/dev/null && sudo swapon /mnt/wotr.swap
      - name: Pinned dependencies
        env:
          GITHUB_TOKEN: ${{ github.token }}
        # As scripts/unity.sh does locally: some EditMode tests export their reports into .artifacts.
        run: |
          python3 scripts/bootstrap_deps.py fetch
          mkdir -p .artifacts
      # The GameCI CLI itself, as unity-builder runs it: unity-test-runner v4.4.0 passes --no-coverageEnabled, which
      # CLI v0.1.72 rejects before Unity starts. Coverage stays off (it crashes some Unity versions, GameCI #302).
      - name: GameCI CLI v0.1.72
        run: |
          curl -fsSL -o "$RUNNER_TEMP/game-ci.tar.gz" https://github.com/game-ci/cli/releases/download/v0.1.72/game-ci-linux-x64.tar.gz
          echo "1de550a620ee92e05e920b6db7d431621440b60b2577f04b4a997dc92a58cb0a  $RUNNER_TEMP/game-ci.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/game-ci.tar.gz" -C "$RUNNER_TEMP"
      - name: EditMode tests (GameCI)
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        run: |
          "$(find "$RUNNER_TEMP" -maxdepth 2 -name game-ci -type f | head -1)" test --docker --dockerShmSize=1025m \
            --engine=unity unity/Wotr.Client --engineVersion=6000.6.0f1 --testPlatforms=editmode \
            --coverageEnabled false --artifactsPath=editmode
      - name: EditMode results
        if: always()
        run: |
          python3 -I - <<'PY'
          import pathlib, xml.etree.ElementTree as ET
          for path in sorted(pathlib.Path("editmode").glob("*.xml")) + sorted(pathlib.Path("unity/Wotr.Client/editmode").glob("*.xml")):
              run = ET.parse(path).getroot()
              if run.tag == "test-run":
                  print(path, {key: run.get(key) for key in ("result", "total", "passed", "failed", "skipped")})
          PY
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: editmode-results
          path: |
            editmode
            unity/Wotr.Client/editmode
          retention-days: 14
