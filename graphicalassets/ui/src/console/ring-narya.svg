<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32">
  <!-- UI-268: Narya, the Ring of Fire (Gandalf): a red-gold band with a ruby crowned by flame. On a console socket; the lit variant wears the gold glow of a Keeper ability offered
       now, the captured variant an ember halo once the Shadow holds it. -->
  <defs>
    <linearGradient id="narya-metal" x1="0.15" y1="0.1" x2="0.85" y2="0.95">
      <stop offset="0" stop-color="#ffe0a8"/>
      <stop offset="0.5" stop-color="#d48a3a"/>
      <stop offset="1" stop-color="#7a3412"/>
    </linearGradient>
    <linearGradient id="narya-inner" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7a3412"/>
      <stop offset="1" stop-color="#d48a3a"/>
    </linearGradient>
    <radialGradient id="narya-stone" cx="0.35" cy="0.3" r="0.8">
      <stop offset="0" stop-color="#ffd0b8"/>
      <stop offset="0.45" stop-color="#e0342a"/>
      <stop offset="1" stop-color="#5e0b05"/>
    </radialGradient>
    <radialGradient id="narya-aura" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0.45" stop-color="#fff3c4" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#ffd06a" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="narya-ember" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0.4" stop-color="#ff5a2a" stop-opacity="0.75"/>
      <stop offset="1" stop-color="#7a1004" stop-opacity="0"/>
    </radialGradient>
    <mask id="narya-hole" maskUnits="userSpaceOnUse" x="0" y="0" width="32" height="32">
      <rect width="32" height="32" fill="#fff"/>
      <ellipse cx="16" cy="20.2" rx="7.9" ry="4.4" fill="#000"/>
    </mask>
  </defs>
  <circle cx="16" cy="16" r="16" fill="url(#narya-aura)" mask="url(#narya-hole)" style="opacity: var(--keeper-aura-opacity)"/>
  <circle cx="16" cy="17" r="15" fill="url(#narya-ember)" mask="url(#narya-hole)" style="opacity: var(--captured-halo-opacity)"/>
  <g filter="url(#lift)">
    <g mask="url(#narya-hole)">
      <ellipse cx="16" cy="19.8" rx="12.2" ry="8.2" fill="url(#narya-metal)" style="stroke: var(--gilt-edge)" stroke-width="0.45"/>
      <ellipse cx="16" cy="18.9" rx="8.4" ry="5.2" fill="url(#narya-inner)"/>
    </g>
    <ellipse cx="16" cy="20.2" rx="7.9" ry="4.4" fill="none" style="stroke: var(--gilt-edge)" stroke-width="0.4"/>
    <path d="M6.5 17.2 C7.8 14.0 11.3 12.4 15 12.2" fill="none" stroke="#fffdf2" stroke-width="0.9" stroke-linecap="round" opacity="0.8"/>
    <path d="M13.2 6.6 C12.6 4.9 13.3 3.6 14.4 2.8 C14.3 4.0 14.8 4.8 15.4 5.3 C15.4 4.0 15.9 2.6 17.2 1.9 C16.9 3.4 17.6 4.4 18.3 5.0 C18.6 4.4 18.7 3.8 18.6 3.2 C19.6 4.2 19.7 5.6 18.9 6.7 Z"
          style="fill: var(--ember); stroke: var(--ember-dark)" stroke-width="0.3" stroke-linejoin="round"/>
    <path d="M12.2 12.4 L13.4 9.4 L18.6 9.4 L19.8 12.4 Z" fill="url(#narya-metal)" style="stroke: var(--gilt-edge)" stroke-width="0.35" stroke-linejoin="round"/>
    <circle cx="16" cy="9.1" r="3.85" fill="url(#narya-metal)" style="stroke: var(--gilt-edge)" stroke-width="0.4"/>
    <circle cx="16" cy="9.1" r="3.00" fill="url(#narya-stone)" stroke="#120c04" stroke-width="0.3"/>
    <circle cx="15.0" cy="8.1" r="0.75" fill="#ffffff" opacity="0.9"/>
  </g>
</svg>
