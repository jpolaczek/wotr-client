<svg xmlns="http://www.w3.org/2000/svg" width="96" height="96" viewBox="0 0 96 96">
  <!-- UI-159: 9-slice plate of the turn console: dark lacquer, a gilt rule along the top edge, thin gilt side
       rules, an engraved lower edge and small corner ornaments. Slices (points): 18. -->
  <defs>
    <linearGradient id="console-fill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" style="stop-color: var(--plate-top)"/>
      <stop offset="0.55" style="stop-color: var(--plate-mid)"/>
      <stop offset="1" style="stop-color: var(--plate-bottom)"/>
    </linearGradient>
    <g id="console-corner" fill="none" stroke-linecap="round">
      <path d="M3 15 C3 8.4 8.4 3 15 3" stroke="url(#gilt)" stroke-width="1.1"/>
      <path d="M2.2 6 L6 2.2 L9.8 6 L6 9.8 Z" fill="url(#gilt-diagonal)" style="stroke: var(--gilt-edge)" stroke-width="0.4"/>
      <circle cx="6" cy="6" r="0.9" stroke="none" style="fill: var(--ink)"/>
    </g>
  </defs>
  <rect width="96" height="96" fill="url(#console-fill)"/>
  <g filter="url(#engrave)" fill="none">
    <path d="M15 3 H81" stroke="url(#gilt)" stroke-width="1.2"/>
    <path d="M15 6 H81" style="stroke: var(--gilt-shadow)" stroke-width="0.6"/>
    <path d="M3 15 V81 M93 15 V81" style="stroke: var(--gilt-shadow)" stroke-width="0.7"/>
    <path d="M15 93.5 H81" style="stroke: var(--gilt-edge)" stroke-width="0.8"/>
    <use href="#console-corner"/>
    <use href="#console-corner" transform="translate(96 0) scale(-1 1)"/>
    <use href="#console-corner" transform="translate(0 96) scale(1 -1)"/>
    <use href="#console-corner" transform="translate(96 96) scale(-1 -1)"/>
  </g>
</svg>
