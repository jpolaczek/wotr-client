<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32">
  <!-- UI-268: Nenya, the Ring of Water (Galadriel): a mithril band with a white adamant that glints like a star. On a console socket; the lit variant wears the gold glow of a Keeper ability offered
       now, the captured variant an ember halo once the Shadow holds it. -->
  <defs>
    <linearGradient id="nenya-metal" x1="0.15" y1="0.1" x2="0.85" y2="0.95">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.5" stop-color="#c9d3da"/>
      <stop offset="1" stop-color="#6c7a84"/>
    </linearGradient>
    <linearGradient id="nenya-inner" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6c7a84"/>
      <stop offset="1" stop-color="#c9d3da"/>
    </linearGradient>
    <radialGradient id="nenya-stone" cx="0.35" cy="0.3" r="0.8">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.45" stop-color="#e6f3ff"/>
      <stop offset="1" stop-color="#9db6cc"/>
    </radialGradient>
    <radialGradient id="nenya-aura" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0.45" stop-color="#fff3c4" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#ffd06a" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="nenya-ember" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0.4" stop-color="#ff5a2a" stop-opacity="0.75"/>
      <stop offset="1" stop-color="#7a1004" stop-opacity="0"/>
    </radialGradient>
    <mask id="nenya-hole" maskUnits="userSpaceOnUse" x="0" y="0" width="32" height="32">
      <rect width="32" height="32" fill="#fff"/>
      <ellipse cx="16" cy="20.2" rx="7.9" ry="4.4" fill="#000"/>
    </mask>
  </defs>
  <circle cx="16" cy="16" r="16" fill="url(#nenya-aura)" mask="url(#nenya-hole)" style="opacity: var(--keeper-aura-opacity)"/>
  <circle cx="16" cy="17" r="15" fill="url(#nenya-ember)" mask="url(#nenya-hole)" style="opacity: var(--captured-halo-opacity)"/>
  <g filter="url(#lift)">
    <g mask="url(#nenya-hole)">
      <ellipse cx="16" cy="19.8" rx="12.2" ry="8.2" fill="url(#nenya-metal)" style="stroke: var(--gilt-edge)" stroke-width="0.45"/>
      <ellipse cx="16" cy="18.9" rx="8.4" ry="5.2" fill="url(#nenya-inner)"/>
    </g>
    <ellipse cx="16" cy="20.2" rx="7.9" ry="4.4" fill="none" style="stroke: var(--gilt-edge)" stroke-width="0.4"/>
    <path d="M6.5 17.2 C7.8 14.0 11.3 12.4 15 12.2" fill="none" stroke="#fffdf2" stroke-width="0.9" stroke-linecap="round" opacity="0.8"/>
    <path d="M16 1.2 L16.8 6.9 L16 8.0 L15.2 6.9 Z M16 17.0 L15.2 11.3 L16 10.2 L16.8 11.3 Z M7.4 9.1 L13.1 8.3 L14.2 9.1 L13.1 9.9 Z M24.6 9.1 L18.9 9.9 L17.8 9.1 L18.9 8.3 Z"
          fill="#ffffff" opacity="0.95"/>
    <path d="M12.2 12.4 L13.4 9.4 L18.6 9.4 L19.8 12.4 Z" fill="url(#nenya-metal)" style="stroke: var(--gilt-edge)" stroke-width="0.35" stroke-linejoin="round"/>
    <circle cx="16" cy="9.1" r="3.75" fill="url(#nenya-metal)" style="stroke: var(--gilt-edge)" stroke-width="0.4"/>
    <circle cx="16" cy="9.1" r="2.90" fill="url(#nenya-stone)" stroke="#120c04" stroke-width="0.3"/>
    <circle cx="15.0" cy="8.1" r="0.75" fill="#ffffff" opacity="0.9"/>
  </g>
</svg>
