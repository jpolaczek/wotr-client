<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64">
  <!-- UI-470 (owner, 2026-11-03): the card of every menu window (sign-in, the main menu's window and column, the
       waiting room, Settings, the questions, the board's Menu). 9-slice, 12 points on every side: a translucent
       charcoal plate under one thin muted-gilt rule whose corners are cut in small concave arcs, a tiny gilt lozenge in
       each cut and a hairline inner rule. Nothing thick: no bevel, band or shadow. -->
  <path d="M5.5 0.5 H58.5 A5 5 0 0 0 63.5 5.5 V58.5 A5 5 0 0 0 58.5 63.5 H5.5 A5 5 0 0 0 0.5 58.5 V5.5 A5 5 0 0 0 5.5 0.5 Z"
    style="fill: var(--fe-card); fill-opacity: var(--fe-card-opacity); stroke: var(--fe-rule)" stroke-width="1"/>
  <path d="M7.5 4.5 H56.5 A3 3 0 0 0 59.5 7.5 V56.5 A3 3 0 0 0 56.5 59.5 H7.5 A3 3 0 0 0 4.5 56.5 V7.5 A3 3 0 0 0 7.5 4.5 Z"
    fill="none" style="stroke: var(--fe-rule)" stroke-width="0.5" stroke-opacity="0.45"/>
  <g style="fill: var(--fe-rule-bright)">
    <path d="M2.1 0.6 L3.6 2.1 L2.1 3.6 L0.6 2.1 Z"/>
    <path d="M61.9 0.6 L63.4 2.1 L61.9 3.6 L60.4 2.1 Z"/>
