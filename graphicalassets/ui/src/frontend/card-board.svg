<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64">
  <!-- UI-472 (owner, 2026-11-03): the menus' card (card.svg) for what stands on the board's bright parchment. 9-slice, 12
       points on every side, the same concave corners, lozenges and inner rule. Two differences keep it readable there:
       a nearly opaque field, because the map's white borders and tokens would show through the menus' translucent plate
       and a window stacked over another would mix their words; and a dark hairline outside the muted-gilt rule, because
       muted gilt on parchment disappears. -->
  <path d="M5.5 0.5 H58.5 A5 5 0 0 0 63.5 5.5 V58.5 A5 5 0 0 0 58.5 63.5 H5.5 A5 5 0 0 0 0.5 58.5 V5.5 A5 5 0 0 0 5.5 0.5 Z"
    style="fill: var(--fe-card); fill-opacity: 0.985; stroke: var(--ink)" stroke-width="1" stroke-opacity="0.85"/>
  <path d="M6.5 1.5 H57.5 A5 5 0 0 0 62.5 6.5 V57.5 A5 5 0 0 0 57.5 62.5 H6.5 A5 5 0 0 0 1.5 57.5 V6.5 A5 5 0 0 0 6.5 1.5 Z"
    fill="none" style="stroke: var(--fe-rule)" stroke-width="1"/>
  <path d="M8.5 5 H55.5 A3 3 0 0 0 59 8.5 V55.5 A3 3 0 0 0 55.5 59 H8.5 A3 3 0 0 0 5 55.5 V8.5 A3 3 0 0 0 8.5 5 Z"
    fill="none" style="stroke: var(--fe-rule)" stroke-width="0.5" stroke-opacity="0.45"/>
  <g style="fill: var(--fe-rule-bright); stroke: var(--ink)" stroke-width="0.4" stroke-opacity="0.85">
    <path d="M2.1 0.5 L3.7 2.1 L2.1 3.7 L0.5 2.1 Z"/>
    <path d="M61.9 0.5 L63.5 2.1 L61.9 3.7 L60.3 2.1 Z"/>
    <path d="M2.1 60.3 L3.7 61.9 L2.1 63.5 L0.5 61.9 Z"/>
    <path d="M61.9 60.3 L63.5 61.9 L61.9 63.5 L60.3 61.9 Z"/>
  </g>
</svg>
