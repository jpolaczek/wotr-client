  </defs>
  <g filter="url(#lift)" stroke-linejoin="round">
    <path d="M4.2 22.6 L3 9.4 L9.4 15.4 L12.4 6.4 L16 13.6 L19.6 6.4 L22.6 15.4 L29 9.4 L27.8 22.6 Z" fill="url(#gilt)"
