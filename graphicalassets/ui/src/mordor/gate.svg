    <linearGradient id="gate-stone" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" style="stop-color: var(--slab-stone-light)"/>
      <stop offset="1" style="stop-color: var(--slab-stone-dark)"/>
    </linearGradient>
  </defs>
  <circle cx="16" cy="17" r="14.4" style="fill: var(--slab-glow); opacity: var(--slab-glow-opacity)" filter="url(#glow)"/>
  <path d="M4.6 28.4 L4.6 9.6 L6.8 6.4 L9 9.6 L9 12 L23 12 L23 9.6 L25.2 6.4 L27.4 9.6 L27.4 28.4 Z" fill="url(#gate-stone)" style="stroke: var(--slab-ink)" stroke-width="1.4" stroke-linejoin="round"/>
  <path d="M11.2 28.4 L11.2 19.6 Q11.2 14.8 16 14.8 Q20.8 14.8 20.8 19.6 L20.8 28.4 Z" style="fill: var(--slab-ink)" fill-opacity="0.9"/>
