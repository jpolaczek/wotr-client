  <path d="M5.8 13.4 L8 13.4 M24 13.4 L26.2 13.4 M5.8 17.6 L8 17.6 M24 17.6 L26.2 17.6" fill="none" style="stroke: var(--slab-ink)" stroke-opacity="0.6" stroke-width="0.8" stroke-linecap="round"/>
