<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 32 32">
  <!-- UI-153: an entrance of the Mordor track (Morannon, Minas Morgul): an ink-drawn gate of two towers and a
       dark arch. The next variant lights the legal green glow while the Fellowship may enter. -->
