<svg xmlns="http://www.w3.org/2000/svg" width="34" height="28" viewBox="0 0 68 56">
  <!-- UI-153: the Crack of Doom, the last step of the Mordor track: an ink-drawn crater rim on the summit of
       Orodruin with a glowing fissure and a curl of smoke. The next variant lights the legal green glow. -->
