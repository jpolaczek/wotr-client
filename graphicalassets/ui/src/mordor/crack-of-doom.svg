      <stop offset="0" style="stop-color: var(--ember-light)"/>
      <stop offset="0.45" style="stop-color: var(--ember)"/>
      <stop offset="1" style="stop-color: var(--ember-dark)"/>
    </radialGradient>
  </defs>
  <ellipse cx="34" cy="34" rx="31" ry="20" style="fill: var(--slab-glow); opacity: var(--slab-glow-opacity)" filter="url(#glow)"/>
  <path d="M6 38 Q5 31 11.4 27.6 L19 22.6 Q23.4 19.4 28 21.2 L33 19.6 Q37.4 18.4 41 20.8 L48.6 23.4 Q56.6 26.2 60.6 31.4 Q63.4 35.4 60.2 40.4 Q55.8 46.4 44 47.6 L24.6 47.8 Q11.8 47.2 7.6 42.6 Z" fill="url(#crack-of-doom-rim)" style="stroke: var(--slab-ink)" stroke-width="1.8" stroke-linejoin="round"/>
