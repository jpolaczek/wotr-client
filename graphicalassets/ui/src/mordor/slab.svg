<svg xmlns="http://www.w3.org/2000/svg" width="24" height="18" viewBox="0 0 48 36">
  <!-- UI-153: a flagstone of the Mordor track, drawn in the warm ink of the pencil map. The passed variant
       fades it into the paper; the next variant lights the legal green glow beneath it. Code writes the step
       number on its face and stands the Fellowship on the current one. -->
  <defs>
    <linearGradient id="slab-face" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0" style="stop-color: var(--slab-stone-light)"/>
      <stop offset="1" style="stop-color: var(--slab-stone-dark)"/>
    </linearGradient>
  </defs>
  <ellipse cx="24" cy="19" rx="22" ry="15" style="fill: var(--slab-glow); opacity: var(--slab-glow-opacity)" filter="url(#glow)"/>
  <path d="M6.5 13.5 L9 26.5 Q10 30.5 14.5 30.8 L36 31.4 Q40.6 31.2 41.6 27 L43.4 14.2 Z" style="fill: var(--slab-edge); stroke: var(--slab-ink)" stroke-width="1.4" stroke-linejoin="round"/>
  <path d="M5.2 11.8 Q4.6 6.2 10.4 5.2 L22.6 4 Q26 3.7 28.6 4.8 L38.8 5.6 Q44.4 6.6 43.6 12.4 L42.8 19.6 Q42.2 24.4 36.8 24.8 L13.6 25.6 Q7.4 25.8 6.4 20.8 Z" fill="url(#slab-face)" style="stroke: var(--slab-ink)" stroke-width="1.6" stroke-linejoin="round"/>
  <path d="M9.4 9.4 Q14 7.8 21 7.6" fill="none" stroke="#ffffff" stroke-opacity="0.35" stroke-width="1.2" stroke-linecap="round"/>
  <path d="M30.5 6.2 L28.2 11.6 L31.4 15" fill="none" style="stroke: var(--slab-ink)" stroke-opacity="0.55" stroke-width="0.9" stroke-linecap="round"/>
  <path d="M12 28.6 L14.6 26.2 M18.4 29 L21 26.4 M24.8 29.2 L27.4 26.6 M31.2 29.4 L33.8 26.8 M37.2 29 L39.4 26.6" fill="none" style="stroke: var(--slab-ink)" stroke-opacity="0.6" stroke-width="0.9" stroke-linecap="round"/>
  <path d="M5.2 11.8 Q4.6 6.2 10.4 5.2 L22.6 4 Q26 3.7 28.6 4.8 L38.8 5.6 Q44.4 6.6 43.6 12.4 L43.4 14.2 L41.6 27 Q40.6 31.2 36 31.4 L14.5 30.8 Q10 30.5 9 26.5 L6.5 13.5 Z" style="fill: var(--slab-veil); opacity: var(--slab-veil-opacity)"/>
</svg>
