<svg xmlns="http://www.w3.org/2000/svg" width="44" height="44" viewBox="0 0 44 44">
  <!-- UI-110: a bright gilt halo behind a track symbol that can be clicked to move the Fellowship. -->
  <defs>
    <radialGradient id="move-halo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" style="stop-color: var(--gilt-highlight)" stop-opacity="1"/>
      <stop offset="0.42" style="stop-color: var(--gilt-highlight)" stop-opacity="0.85"/>
      <stop offset="0.66" style="stop-color: var(--gilt-light)" stop-opacity="0.5"/>
      <stop offset="0.86" style="stop-color: var(--gilt-mid)" stop-opacity="0.16"/>
      <stop offset="1" style="stop-color: var(--gilt-mid)" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <circle cx="22" cy="22" r="22" fill="url(#move-halo)"/>
  <circle cx="22" cy="22" r="15.5" fill="none" style="stroke: var(--gilt-highlight)" stroke-width="1.4" opacity="0.95"/>
</svg>
