<svg xmlns="http://www.w3.org/2000/svg" width="96" height="28" viewBox="0 0 96 28">
  <!-- 9-slice ledge for figures that stay out of the fight (garrison, rear guard). Slices (points): 10. -->
  <defs>
    <linearGradient id="shelf-fill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#000" stop-opacity="0.34"/>
      <stop offset="1" stop-color="#000" stop-opacity="0.18"/>
    </linearGradient>
  </defs>
  <rect x="1" y="1" width="94" height="26" rx="2" fill="url(#shelf-fill)"/>
  <rect x="1.5" y="1.5" width="93" height="25" rx="2" fill="none" style="stroke: var(--gilt-shadow)" stroke-width="0.7" stroke-dasharray="3 2" opacity="0.8"/>
</svg>
