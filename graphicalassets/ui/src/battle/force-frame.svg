<svg xmlns="http://www.w3.org/2000/svg" width="96" height="96" viewBox="0 0 96 96">
  <!-- 9-slice frame of one side of a battle: enamel plate with a gilt hairline and small corner studs. Slices (points): 14. -->
  <defs>
    <linearGradient id="force-fill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" style="stop-color: var(--enamel-light)"/>
      <stop offset="0.35" style="stop-color: var(--enamel-mid)"/>
      <stop offset="1" style="stop-color: var(--enamel-dark)"/>
    </linearGradient>
    <g id="force-corner">
      <path d="M2.2 6.2 L6.2 2.2 L10.2 6.2 L6.2 10.2 Z" fill="url(#gilt-diagonal)" style="stroke: var(--gilt-edge)" stroke-width="0.4"/>
      <circle cx="6.2" cy="6.2" r="0.9" style="fill: var(--ink)"/>
    </g>
  </defs>
  <rect x="1" y="1" width="94" height="94" rx="3" fill="url(#force-fill)"/>
  <rect x="1" y="1" width="94" height="18" rx="3" fill="#fff" opacity="0.04"/>
  <g filter="url(#engrave)" fill="none">
    <rect x="1.5" y="1.5" width="93" height="93" rx="3" stroke="url(#gilt)" stroke-width="1.1"/>
    <rect x="4" y="4" width="88" height="88" rx="2" style="stroke: var(--gilt-shadow)" stroke-width="0.6" opacity="0.8"/>
  </g>
  <use href="#force-corner"/>
  <use href="#force-corner" transform="translate(96 0) scale(-1 1)"/>
  <use href="#force-corner" transform="translate(0 96) scale(1 -1)"/>
  <use href="#force-corner" transform="translate(96 96) scale(-1 -1)"/>
</svg>
