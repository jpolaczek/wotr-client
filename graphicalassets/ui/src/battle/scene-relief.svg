<svg xmlns="http://www.w3.org/2000/svg" width="168" height="44" viewBox="0 0 168 44">
  <!-- Relief: a road and banners of an arriving army. Seamless at x=0/168; stretched vertically, repeated horizontally. -->
  <defs>
    <linearGradient id="scene-relief-sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" style="stop-color: var(--scene-sky-deep)"/>
      <stop offset="0.62" style="stop-color: var(--scene-sky)"/>
      <stop offset="1" style="stop-color: var(--scene-haze)"/>
    </linearGradient>
    <linearGradient id="scene-relief-ground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" style="stop-color: var(--scene-hill)"/>
      <stop offset="1" style="stop-color: var(--scene-hill-dark)"/>
    </linearGradient>
    <linearGradient id="scene-relief-stone" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" style="stop-color: var(--scene-stone)"/>
      <stop offset="1" style="stop-color: var(--scene-stone-dark)"/>
    </linearGradient>
    <linearGradient id="scene-relief-shade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000" stop-opacity="0.45"/>
    </linearGradient>
  </defs>
  <rect width="168" height="44" fill="url(#scene-relief-sky)"/>
  <path d="M0 31 C18 24 36 26 56 30 C76 34 96 22 118 28 C138 33 152 26 168 31 V44 H0 Z" style="fill: var(--scene-hill-dark)" opacity="0.85"/>
  <path d="M0 37 C28 33 44 34 64 38 C84 42 104 33 128 36 C148 38 160 35 168 37 V44 H0 Z" fill="url(#scene-relief-ground)"/>
  <path d="M0 42 C40 38 80 40 120 36 C140 34 156 35 168 36" fill="none" style="stroke: var(--scene-road)" stroke-width="2.2" opacity="0.8"/>
  <g style="fill: var(--ember-light)" opacity="0.9">
    <rect x="40" y="26" width="0.8" height="9"/><path d="M40.8 26 L46 27.5 L40.8 29 Z"/>
    <rect x="98" y="24" width="0.8" height="9"/><path d="M98.8 24 L104 25.5 L98.8 27 Z"/>
    <rect x="140" y="27" width="0.8" height="8"/><path d="M140.8 27 L146 28.5 L140.8 30 Z"/>
  </g>
  <rect y="30" width="168" height="14" fill="url(#scene-relief-shade)"/>
</svg>
