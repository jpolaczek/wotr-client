<svg xmlns="http://www.w3.org/2000/svg" width="168" height="44" viewBox="0 0 168 44">
  <!-- Field battle: open rolling ground. Seamless at x=0/168; stretched vertically, repeated horizontally. -->
  <defs>
    <linearGradient id="scene-field-sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" style="stop-color: var(--scene-sky-deep)"/>
      <stop offset="0.62" style="stop-color: var(--scene-sky)"/>
      <stop offset="1" style="stop-color: var(--scene-haze)"/>
    </linearGradient>
    <linearGradient id="scene-field-ground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" style="stop-color: var(--scene-hill)"/>
      <stop offset="1" style="stop-color: var(--scene-hill-dark)"/>
    </linearGradient>
    <linearGradient id="scene-field-stone" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" style="stop-color: var(--scene-stone)"/>
      <stop offset="1" style="stop-color: var(--scene-stone-dark)"/>
    </linearGradient>
    <linearGradient id="scene-field-shade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000" stop-opacity="0.45"/>
    </linearGradient>
  </defs>
  <rect width="168" height="44" fill="url(#scene-field-sky)"/>
  <path d="M0 33 C20 26 34 26 54 32 C74 38 92 24 112 30 C132 36 150 26 168 33 V44 H0 Z" style="fill: var(--scene-hill-dark)" opacity="0.85"/>
  <path d="M0 37 C24 31 40 32 62 37 C84 42 100 31 124 35 C146 39 158 33 168 37 V44 H0 Z" fill="url(#scene-field-ground)"/>
  <g style="stroke: var(--scene-grass)" stroke-width="0.8" stroke-linecap="round" fill="none" opacity="0.9">
    <path d="M18 38 l1 -3 M20 38 l1.4 -2.6 M22 38 l0.6 -3"/>
    <path d="M70 39 l1 -3 M72 39 l1.4 -2.6 M74 39 l0.6 -3"/>
    <path d="M118 37 l1 -3 M120 37 l1.4 -2.6 M122 37 l0.6 -3"/>
    <path d="M150 39 l1 -3 M152 39 l1.4 -2.6 M154 39 l0.6 -3"/>
  </g>
  <rect y="30" width="168" height="14" fill="url(#scene-field-shade)"/>
</svg>
