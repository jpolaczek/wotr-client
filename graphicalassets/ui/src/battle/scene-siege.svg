<svg xmlns="http://www.w3.org/2000/svg" width="168" height="44" viewBox="0 0 168 44">
  <!-- Siege: the besieged wall with crenellations. Seamless at x=0/168; stretched vertically, repeated horizontally. -->
  <defs>
    <linearGradient id="scene-siege-sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" style="stop-color: var(--scene-sky-deep)"/>
      <stop offset="0.62" style="stop-color: var(--scene-sky)"/>
      <stop offset="1" style="stop-color: var(--scene-haze)"/>
    </linearGradient>
    <linearGradient id="scene-siege-ground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" style="stop-color: var(--scene-hill)"/>
      <stop offset="1" style="stop-color: var(--scene-hill-dark)"/>
    </linearGradient>
    <linearGradient id="scene-siege-stone" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" style="stop-color: var(--scene-stone)"/>
      <stop offset="1" style="stop-color: var(--scene-stone-dark)"/>
    </linearGradient>
    <linearGradient id="scene-siege-shade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000" stop-opacity="0.45"/>
    </linearGradient>
  </defs>
  <rect width="168" height="44" fill="url(#scene-siege-sky)"/>
  <path d="M0 35 C30 31 60 31 84 34 C108 37 140 31 168 35 V44 H0 Z" style="fill: var(--scene-hill-dark)"/>
  <rect y="22" width="168" height="16" fill="url(#scene-siege-stone)"/>
  <g style="fill: var(--scene-stone)">
    <rect x="0" y="18" width="10" height="5"/><rect x="18" y="18" width="10" height="5"/><rect x="36" y="18" width="10" height="5"/>
    <rect x="54" y="18" width="10" height="5"/><rect x="72" y="18" width="10" height="5"/><rect x="90" y="18" width="10" height="5"/>
    <rect x="108" y="18" width="10" height="5"/><rect x="126" y="18" width="10" height="5"/><rect x="144" y="18" width="10" height="5"/><rect x="162" y="18" width="6" height="5"/>
  </g>
  <g style="stroke: var(--scene-stone-dark)" stroke-width="0.6" opacity="0.7" fill="none">
    <path d="M0 27 H168 M0 32 H168"/>
    <path d="M12 22 V27 M30 22 V27 M48 22 V27 M66 22 V27 M84 22 V27 M102 22 V27 M120 22 V27 M138 22 V27 M156 22 V27"/>
    <path d="M4 27 V32 M22 27 V32 M40 27 V32 M58 27 V32 M76 27 V32 M94 27 V32 M112 27 V32 M130 27 V32 M148 27 V32 M166 27 V32"/>
  </g>
  <rect y="37" width="168" height="2" style="fill: var(--scene-stone-dark)"/>
  <rect y="30" width="168" height="14" fill="url(#scene-siege-shade)"/>
</svg>
