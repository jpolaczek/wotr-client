<svg xmlns="http://www.w3.org/2000/svg" width="26" height="26" viewBox="0 0 32 32">
  <!-- Hunt: the flaming lidless eye. -->
  <defs>
    <radialGradient id="hunt-halo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" style="stop-color: var(--ember-light); stop-opacity: 0.85"/>
      <stop offset="0.55" style="stop-color: var(--ember); stop-opacity: 0.5"/>
      <stop offset="1" style="stop-color: var(--ember-dark); stop-opacity: 0"/>
    </radialGradient>
    <radialGradient id="hunt-iris" cx="0.5" cy="0.5" r="0.55">
