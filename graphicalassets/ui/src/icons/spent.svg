<svg xmlns="http://www.w3.org/2000/svg" width="26" height="26" viewBox="0 0 32 32">
  <!-- Spent dice: crossed swords with gilt hilts. -->
  <defs>
    <linearGradient id="spent-steel" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" style="stop-color: var(--steel-dark)"/>
      <stop offset="0.45" style="stop-color: var(--steel-light)"/>
      <stop offset="0.55" style="stop-color: var(--steel-mid)"/>
      <stop offset="1" style="stop-color: var(--steel-dark)"/>
    </linearGradient>
    <g id="spent-sword">
      <path d="M16 2.6 L17.7 5.6 L17.7 20.6 L14.3 20.6 L14.3 5.6 Z" fill="url(#spent-steel)" stroke="#2b3133" stroke-width="0.45"/>
      <path d="M16 5.2 V19.8" style="stroke: var(--steel-dark)" stroke-width="0.45"/>
      <rect x="10.2" y="20.4" width="11.6" height="2.3" rx="1.1" fill="url(#gilt)" style="stroke: var(--gilt-edge)" stroke-width="0.4"/>
      <rect x="15" y="22.6" width="2" height="4.8" fill="#4b2d17" stroke="#24150a" stroke-width="0.35"/>
      <circle cx="16" cy="28.6" r="1.6" fill="url(#gilt-diagonal)" style="stroke: var(--gilt-edge)" stroke-width="0.4"/>
    </g>
  </defs>
  <g filter="url(#lift)">
    <use href="#spent-sword" transform="rotate(-42 16 16)"/>
    <use href="#spent-sword" transform="rotate(42 16 16)"/>
  </g>
</svg>
