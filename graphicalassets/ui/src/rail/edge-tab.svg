<svg xmlns="http://www.w3.org/2000/svg" width="94" height="66" viewBox="0 0 94 66">
  <!-- UI-475 (owner, 2026-11-03): a left rail tab (Politics, Reserve, Characters, Effects) in the style of the menus'
       medallion (frontend/medallion): a dark enamel disc in one thin ring and a hairline ring, which holds the icon (drawn
       by USS on the centre 47,22, 24x24); the label stands under it, drawn by USS. The plate behind it is USS too: a dark
       fill under one thin line. States show on the ring and the disc: hover lightens both, selected (a panel held open)
       is a warm disc in a bright ring, pressed darkens both. UI-193: an available tab glows gold round the disc, a soft
       disc of light and a thin bright ring (the label below stays clear of it). -->
  <defs>
    <radialGradient id="tab-enamel" cx="47" cy="20" r="18" gradientUnits="userSpaceOnUse">
      <stop offset="0" style="stop-color: var(--tab-enamel-light, var(--enamel-light))"/>
      <stop offset="0.65" style="stop-color: var(--tab-enamel-mid, var(--enamel-mid))"/>
      <stop offset="1" style="stop-color: var(--tab-enamel-dark, var(--enamel-dark))"/>
    </radialGradient>
    <radialGradient id="tab-halo" cx="47" cy="22" r="22" gradientUnits="userSpaceOnUse">
      <stop offset="0.74" style="stop-color: var(--tab-glow)" stop-opacity="0.95"/>
      <stop offset="0.86" style="stop-color: var(--tab-glow)" stop-opacity="0.5"/>
      <stop offset="1" style="stop-color: var(--tab-glow)" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <g style="opacity: var(--tab-glow-opacity)">
    <circle cx="47" cy="22" r="22" fill="url(#tab-halo)"/>
    <circle cx="47" cy="22" r="19.4" fill="none" style="stroke: var(--tab-glow)" stroke-width="1.6" filter="url(#glow)"/>
  </g>
  <circle cx="47" cy="22" r="18" fill="url(#tab-enamel)" fill-opacity="0.94" style="stroke: var(--fe-line)" stroke-width="1.1"/>
  <circle cx="47" cy="22" r="15.8" fill="none" style="stroke: var(--fe-line)" stroke-width="0.5" stroke-opacity="0.55"/>
</svg>
