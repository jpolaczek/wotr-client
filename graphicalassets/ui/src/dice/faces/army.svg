<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 32 32">
  <!-- Army result: a sword behind a round shield. Ivory glyph with an ink outline, drawn over the die medallion's enamel. -->
  <defs>
    <linearGradient id="army-ivory" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fffaea"/>
      <stop offset="0.55" style="stop-color: var(--ivory)"/>
      <stop offset="1" stop-color="#d8c189"/>
    </linearGradient>
  </defs>
  <g filter="url(#lift)" stroke-linejoin="round" stroke-linecap="round">
    <path d="M21.4 2.8 L23.2 5.8 L23.2 19.6 L19.6 19.6 L19.6 5.8 Z" fill="url(#army-ivory)" style="stroke: var(--ink)" stroke-width="1.3"/>
    <rect x="16.4" y="19.4" width="10" height="2.6" rx="1.2" fill="url(#gilt)" style="stroke: var(--ink)" stroke-width="1"/>
    <rect x="20.3" y="21.8" width="2.2" height="4.4" style="fill: var(--gilt-shadow); stroke: var(--ink)" stroke-width="0.9"/>
    <circle cx="21.4" cy="27.6" r="1.7" fill="url(#gilt)" style="stroke: var(--ink)" stroke-width="0.9"/>
    <circle cx="12.4" cy="17.6" r="8.8" fill="url(#army-ivory)" style="stroke: var(--ink)" stroke-width="1.5"/>
    <circle cx="12.4" cy="17.6" r="6.2" fill="none" style="stroke: var(--ink)" stroke-width="0.8" opacity="0.6"/>
    <circle cx="12.4" cy="17.6" r="2.3" fill="url(#gilt)" style="stroke: var(--ink)" stroke-width="0.9"/>
  </g>
</svg>
