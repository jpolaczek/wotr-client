    <path d="M15.8 17.4 C17.6 19.6 19.4 21.2 19.4 23.6 C19.4 25.8 17.8 27 15.8 27 C13.8 27 12.4 25.6 12.4 23.6 C12.4 21.4 14.4 20 15.8 17.4 Z" style="fill: var(--ember-light)" opacity="0.9"/>
