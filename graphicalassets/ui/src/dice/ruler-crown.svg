<svg xmlns="http://www.w3.org/2000/svg" width="18" height="12" viewBox="0 0 18 12">
  <!-- UI-273: the crown a Kings Ruler die wears on its top edge. -->
  <defs>
    <linearGradient id="ruler-gold" x1="0.2" y1="0" x2="0.8" y2="1">
      <stop offset="0" style="stop-color: var(--crown-light)"/>
      <stop offset="1" style="stop-color: var(--crown-dark)"/>
    </linearGradient>
  </defs>
  <g filter="url(#lift)">
    <path d="M2.6 9.2 L1.8 2.6 L5.6 5.4 L9 1.2 L12.4 5.4 L16.2 2.6 L15.4 9.2 Z" fill="url(#ruler-gold)"
          style="stroke: var(--gilt-edge)" stroke-width="0.55" stroke-linejoin="round"/>
    <rect x="2.5" y="9" width="13" height="2.2" rx="0.6" fill="url(#ruler-gold)" style="stroke: var(--gilt-edge)" stroke-width="0.5"/>
    <circle cx="1.8" cy="2.4" r="0.95" fill="url(#ruler-gold)" style="stroke: var(--gilt-edge)" stroke-width="0.3"/>
    <circle cx="9" cy="1.1" r="1.0" fill="url(#ruler-gold)" style="stroke: var(--gilt-edge)" stroke-width="0.3"/>
    <circle cx="16.2" cy="2.4" r="0.95" fill="url(#ruler-gold)" style="stroke: var(--gilt-edge)" stroke-width="0.3"/>
    <circle cx="9" cy="7.2" r="1.1" style="fill: var(--crown-stone)" stroke="#1a0c06" stroke-width="0.3"/>
  </g>
</svg>
