<svg xmlns="http://www.w3.org/2000/svg" width="40" height="40" viewBox="0 0 32 32">
  <!-- UI-267: a Lords special die. The round action die with a second, rune-studded band in the metal of its origin
       (the Keeper's Ring or the Lesser Minion) round an enamel of the same colour. The client draws the face glyph,
       the origin emblem (dice/origins) and the Remove star (dice/remove-star) on top. -->
  <defs>
    <linearGradient id="special-band" x1="0.15" y1="0.1" x2="0.85" y2="0.95">
      <stop offset="0" style="stop-color: var(--special-band-light)"/>
      <stop offset="1" style="stop-color: var(--special-band-dark)"/>
    </linearGradient>
  </defs>
  <circle cx="16" cy="16" r="15.0" fill="none" style="stroke: var(--gilt-highlight); opacity: var(--glow-opacity)" stroke-width="2.6" filter="url(#glow)"/>
  <g filter="url(#lift)">
    <circle cx="16" cy="16" r="14.6" fill="url(#gilt-diagonal)" style="stroke: var(--gilt-edge)" stroke-width="0.5"/>
    <circle cx="16" cy="16" r="13.5" fill="url(#special-band)" style="stroke: var(--gilt-edge)" stroke-width="0.4"/>
    <g style="fill: var(--gilt-highlight); stroke: var(--gilt-edge)" stroke-width="0.22">
      <path d="M16 1.9 L16.75 2.95 L16 4 L15.25 2.95 Z"/>
      <path d="M30.1 16 L29.05 16.75 L28 16 L29.05 15.25 Z"/>
      <path d="M16 30.1 L15.25 29.05 L16 28 L16.75 29.05 Z"/>
      <path d="M1.9 16 L2.95 15.25 L4 16 L2.95 16.75 Z"/>
      <circle cx="25.97" cy="6.03" r="0.55"/>
      <circle cx="25.97" cy="25.97" r="0.55"/>
      <circle cx="6.03" cy="25.97" r="0.55"/>
      <circle cx="6.03" cy="6.03" r="0.55"/>
    </g>
    <circle cx="16" cy="16" r="11.6" fill="url(#gilt-bevel)"/>
    <circle cx="16" cy="16" r="10.8" style="fill: var(--ink)"/>
    <circle cx="16" cy="16" r="10.3" fill="url(#enamel-dome)"/>
    <path d="M8.6 12.8 A8.2 8.2 0 0 1 19.4 7.1" fill="none" stroke="#fff" stroke-opacity="0.11" stroke-width="1.3" stroke-linecap="round"/>
  </g>
</svg>
