<svg xmlns="http://www.w3.org/2000/svg" width="192" height="44" viewBox="0 0 192 44">
  <!-- 9-slice overlay of the top bar: gilt upper and lower rules with a plain gilt post at each end; the cast shadow
       is surfaces/cast-shadow. UI-202: no scrolls, leaves or bosses, so nothing gilt reaches the phase text or the
       Menu button. Slices (points): left/right 8, top 20, bottom 20. Only straight lines cross the stretched middle. -->
  <defs>
    <g id="frame-cap" filter="url(#engrave)">
      <!-- Outer gilt post joining both rules, and a dim inner hairline. -->
      <rect x="1" y="3" width="2" height="38" fill="url(#gilt-side)"/>
      <rect x="5" y="6" width="0.9" height="32" style="fill: var(--gilt-dim)" opacity="0.85"/>
    </g>
  </defs>
  <!-- Upper rule, mirroring the lower one: dark edge, gilt hairline, gap, gilt band, dark keyline. -->
  <rect x="0" y="0" width="192" height="1" style="fill: var(--cast-shadow)"/>
  <rect x="0" y="1" width="192" height="1" style="fill: var(--gilt-dim)" opacity="0.9"/>
  <rect x="0" y="2" width="192" height="1" style="fill: var(--ink)"/>
  <rect x="0" y="3" width="192" height="2" fill="url(#gilt)"/>
  <rect x="0" y="5" width="192" height="1" fill="#000" opacity="0.6"/>
  <!-- Lower rule: dark keyline, gilt band, gap, gilt hairline, dark edge. -->
  <rect x="0" y="37" width="192" height="1" fill="#000" opacity="0.6"/>
  <rect x="0" y="38" width="192" height="2" fill="url(#gilt)"/>
  <rect x="0" y="40" width="192" height="1" style="fill: var(--ink)"/>
  <rect x="0" y="41" width="192" height="1" style="fill: var(--gilt-dim)" opacity="0.9"/>
  <rect x="0" y="42" width="192" height="2" style="fill: var(--cast-shadow)"/>
  <use href="#frame-cap"/>
  <use href="#frame-cap" transform="translate(192 0) scale(-1 1)"/>
</svg>
