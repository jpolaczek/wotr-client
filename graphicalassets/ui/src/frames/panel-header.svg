<svg xmlns="http://www.w3.org/2000/svg" width="120" height="32" viewBox="0 0 120 32">
  <!-- 9-slice header band in red lacquer with gilt rules. Slices (points): left/right 16, top/bottom 8.
       UI-203: the band is closed at both ends with chamfered corners and a gilt outline all round, so it never looks
       cut off; no end ornaments for a header button to cover. -->
  <path d="M6 1 H114 L119 6 V26 L114 31 H6 L1 26 V6 Z" fill="url(#lacquer-red)"/>
  <path d="M8 4 H112" stroke="#fff" stroke-width="1" opacity="0.07"/>
  <g filter="url(#engrave)" fill="none">
    <path d="M6 1 H114 L119 6 V26 L114 31 H6 L1 26 V6 Z" stroke="url(#gilt)" stroke-width="1.3"/>
    <path d="M7 3.2 H113 L116.8 7 V25 L113 28.8 H7 L3.2 25 V7 Z" style="stroke: var(--gilt-shadow)" stroke-width="0.6"/>
  </g>
</svg>
