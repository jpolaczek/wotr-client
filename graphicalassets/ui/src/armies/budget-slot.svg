<svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 18 18">
  <!-- One recruitment point of a Muster action (UI-125): an empty gilt socket; the filled variant sets a gilt coin in it. -->
  <g filter="url(#lift)">
    <circle cx="9" cy="9" r="7.6" fill="url(#gilt-diagonal)" style="stroke: var(--gilt-edge)" stroke-width="0.5"/>
    <circle cx="9" cy="9" r="6.2" style="fill: var(--plate-bottom)"/>
    <circle cx="9" cy="9" r="4.8" fill="url(#gilt)" style="opacity: var(--slot-fill-opacity)"/>
  </g>
</svg>
