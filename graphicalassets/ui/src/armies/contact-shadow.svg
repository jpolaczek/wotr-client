<svg xmlns="http://www.w3.org/2000/svg" width="112" height="20" viewBox="0 0 112 20">
  <!-- UI-400: the contact shadow under a miniature's base, a little down and right as light falls from the upper left.
       It stays on the table when the figure lifts (UI-403); code scales it with the base. -->
  <defs>
    <radialGradient id="contact-shadow-fall" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" style="stop-color: var(--ink)" stop-opacity="0.55"/>
      <stop offset="0.62" style="stop-color: var(--ink)" stop-opacity="0.28"/>
      <stop offset="1" style="stop-color: var(--ink)" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <ellipse cx="58" cy="11" rx="54" ry="9" fill="url(#contact-shadow-fall)"/>
</svg>
