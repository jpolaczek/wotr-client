<svg xmlns="http://www.w3.org/2000/svg" width="480" height="120" viewBox="0 0 480 120">
  <!-- UI-169: the end-of-game scene of the Free Peoples' Ring victory: Mount Doom erupting under a burning sky,
       the Ring falling into the Crack of Doom. Framed by a thin gilt rule with rounded corners. -->
  <defs>
    <clipPath id="doom-clip"><rect x="2" y="2" width="476" height="116" rx="10"/></clipPath>
    <linearGradient id="doom-sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a0605"/>
      <stop offset="0.55" stop-color="#5a140a"/>
      <stop offset="1" stop-color="#c2410f"/>
    </linearGradient>
    <radialGradient id="doom-glow" cx="0.5" cy="0.4" r="0.5">
      <stop offset="0" stop-color="#ffd27a" stop-opacity="0.95"/>
      <stop offset="0.35" stop-color="#f06a1f" stop-opacity="0.65"/>
      <stop offset="1" stop-color="#8c1a0b" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="doom-rock" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#33201a"/>
      <stop offset="1" stop-color="#0b0605"/>
    </linearGradient>
  </defs>
  <g clip-path="url(#doom-clip)">
    <rect width="480" height="120" fill="url(#doom-sky)"/>
    <ellipse cx="240" cy="46" rx="130" ry="64" fill="url(#doom-glow)"/>
    <path d="M226 46 C 206 26, 248 12, 230 -4 L 262 -4 C 284 12, 258 28, 254 46 Z" fill="#2b1410" opacity="0.75"/>
    <path d="M0 98 L36 86 L74 94 L118 80 L156 92 L188 86 L206 94 L274 94 L296 84 L330 92 L372 80 L414 92 L452 84 L480 90 L480 120 L0 120 Z" fill="#170b08"/>
    <path d="M118 120 L212 52 L226 47 L254 47 L268 52 L362 120 Z" fill="url(#doom-rock)"/>
    <path d="M212 52 Q240 36 268 52 Q240 46 212 52 Z" fill="#ffb347"/>
    <path d="M231 53 C 224 70, 236 84, 220 106 L 227 106 C 243 84, 231 70, 238 53 Z" fill="#f06a1f"/>
    <path d="M249 54 C 258 74, 247 90, 262 114 L 269 114 C 254 90, 265 74, 256 54 Z" fill="#ff8a2a"/>
    <circle cx="240" cy="26" r="5.5" fill="none" stroke="#ffe08a" stroke-width="2.2"/>
    <circle cx="240" cy="26" r="9" fill="#ffd27a" opacity="0.25"/>
    <path d="M0 120 L0 108 L60 103 L110 112 L150 105 L200 114 L280 114 L330 105 L380 112 L430 103 L480 108 L480 120 Z" fill="#090403"/>
  </g>
  <rect x="2" y="2" width="476" height="116" rx="10" fill="none" stroke="url(#gilt)" stroke-width="2"/>
</svg>
