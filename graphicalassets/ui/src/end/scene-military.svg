<svg xmlns="http://www.w3.org/2000/svg" width="480" height="120" viewBox="0 0 480 120">
  <!-- UI-169: the end-of-game scene of a military victory: the winner's banners (free or shadow enamel) over a
       taken fortress at dusk, spears raised. Framed by a thin gilt rule with rounded corners. -->
  <defs>
    <clipPath id="war-clip"><rect x="2" y="2" width="476" height="116" rx="10"/></clipPath>
    <linearGradient id="war-sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#141c22"/>
      <stop offset="0.6" stop-color="#3a3a3a"/>
      <stop offset="1" stop-color="#8a5a2c"/>
    </linearGradient>
    <linearGradient id="war-banner" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" style="stop-color: var(--enamel-light)"/>
      <stop offset="0.6" style="stop-color: var(--enamel-mid)"/>
      <stop offset="1" style="stop-color: var(--enamel-dark)"/>
    </linearGradient>
  </defs>
  <g clip-path="url(#war-clip)">
    <rect width="480" height="120" fill="url(#war-sky)"/>
    <path d="M0 96 L60 88 L120 94 L180 86 L300 86 L360 94 L420 88 L480 94 L480 120 L0 120 Z" fill="#1b1714"/>
    <path d="M120 120 L120 70 L136 70 L136 62 L146 62 L146 70 L162 70 L162 62 L172 62 L172 70 L186 70 L186 50 L198 44 L210 50 L210 70 L270 70 L270 50 L282 44 L294 50 L294 70 L308 70 L308 62 L318 62 L318 70 L334 70 L334 62 L344 62 L344 70 L360 70 L360 120 Z" fill="#0f0d0c"/>
    <rect x="196" y="18" width="2.4" height="30" fill="url(#gilt-side)"/>
    <path d="M198.4 20 L232 24 L222 32 L232 40 L198.4 38 Z" fill="url(#war-banner)" style="stroke: var(--gilt-mid)" stroke-width="0.8"/>
    <rect x="280" y="18" width="2.4" height="30" fill="url(#gilt-side)"/>
    <path d="M282.4 20 L316 24 L306 32 L316 40 L282.4 38 Z" fill="url(#war-banner)" style="stroke: var(--gilt-mid)" stroke-width="0.8"/>
    <rect x="238" y="8" width="3" height="40" fill="url(#gilt-side)"/>
    <path d="M241 10 L274 13 L264 23 L274 33 L241 31 Z" fill="url(#war-banner)" style="stroke: var(--gilt-light)" stroke-width="1"/>
    <g stroke="#2a2420" stroke-width="2">
      <path d="M40 120 L56 70 M70 120 L80 72 M100 120 L104 74 M380 120 L376 74 M410 120 L400 72 M440 120 L424 70"/>
    </g>
    <g fill="#c3cacb">
      <path d="M56 70 L53 78 L59 78 Z M80 72 L77 80 L83 80 Z M104 74 L101 82 L107 82 Z M376 74 L373 82 L379 82 Z M400 72 L397 80 L403 80 Z M424 70 L421 78 L427 78 Z"/>
    </g>
    <path d="M0 120 L0 110 L80 106 L160 112 L240 108 L320 112 L400 106 L480 110 L480 120 Z" fill="#080706"/>
  </g>
  <rect x="2" y="2" width="476" height="116" rx="10" fill="none" stroke="url(#gilt)" stroke-width="2"/>
</svg>
