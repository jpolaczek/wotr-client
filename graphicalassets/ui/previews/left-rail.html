<style>

  .inner { margin: -16px; }
  .header { height: 32px; box-sizing: border-box; border-style: solid; border-width: 8px 16px;
    border-image: url("../../../unity/Wotr.Client/Assets/Wotr/Resources/Wotr/Art/UI/frames/panel-header.png") 16 32 fill stretch;
    display: flex; align-items: center; margin: 0 0 6px; }
  .header i { width: 22px; height: 22px; margin: -4px 6px 0 -2px; background: center / 22px 22px no-repeat; }

  .square { width: 26px; height: 26px; margin: -5px 0 -5px 4px; box-sizing: border-box; border-style: solid; border-width: 8px; font-size: 13px;

    display: flex; align-items: center; justify-content: center; }
  .row { display: flex; align-items: center; height: 28px; border-bottom: 1px solid rgba(0,0,0,.4); }
  .row.fp { background: rgba(26, 50, 72, .62); }
  .row.sh { background: rgba(74, 22, 18, .62); }
  .name { width: 82px; position: relative; padding-left: 24px; box-sizing: border-box; font-size: 12px; }
  .name i { position: absolute; left: 2px; top: -10px; width: 20px; height: 20px; background: center / 20px 20px no-repeat; }
  .slot { width: 40px; text-align: center; color: #9eaba6; font-size: 16px; position: relative; }
  .token { position: absolute; left: 7px; top: -14px; width: 26px; height: 26px; background: center / 26px 26px no-repeat; text-align: center; line-height: 26px; color: #f2f5ef; font-size: 15px; }
  .entry { height: 36px; margin: 4px 0; box-sizing: border-box; border-style: solid; border-width: 10px;
    border-image: url("../../../unity/Wotr.Client/Assets/Wotr/Resources/Wotr/Art/UI/frames/entry.png") 20 fill stretch;
    display: flex; align-items: center; font-size: 12px; }
  .entry.sh { border-image-source: url("../../../unity/Wotr.Client/Assets/Wotr/Resources/Wotr/Art/UI/frames/entry-shadow.png"); }
  .entry small { width: 36px; color: #e6c87a; font-size: 11px; }
