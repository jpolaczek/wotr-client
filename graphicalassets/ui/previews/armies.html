  .token { position: relative; width: 30px; height: 30px; background-size: 30px 30px; }

  .token b { right: -6px; bottom: -3px; font-size: 10px; }
  .badge { width: 14px; height: 14px; background-size: contain; display: block; }
  .panel { background: #0e1619; padding: 6px 8px; margin: 8px 10px; align-items: center; }
  .slot { position: relative; width: 40px; height: 40px; border-style: solid; border-width: 12px; border-image-slice: 24 fill; box-sizing: border-box; display: flex; align-items: flex-end; justify-content: center; }

  .coin { width: 18px; height: 18px; background-size: contain; display: block; }
  .ghost { width: 64px; height: 40px; border-style: solid; border-width: 12px; border-image-slice: 24 fill; box-sizing: border-box; display: flex; align-items: flex-end; justify-content: center; opacity: .55; }
