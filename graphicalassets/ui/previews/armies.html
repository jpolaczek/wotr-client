<!doctype html>
<html>
<head>
<meta charset="utf-8">
<!-- Review the army pieces on the map paper (UI-400, UI-403, UI-406): the miniatures' painted stands over their contact
     shadow with a state rim, the far-zoom token pucks (field and walled garrison, both enamels) with their emblem, count
     and every state rim, a Corrupted king's puck, the landing marks, the moved badge, reserve slots, budget points and the
     ghost outline. Unity USS is the real layout. -->
<style>
  html, body { margin: 0; width: 560px; height: 300px; overflow: hidden; font-family: "Helvetica Neue", Arial, sans-serif; }
  body { background: #e9d6a6; position: relative; }
  .row { display: flex; align-items: flex-end; gap: 12px; margin: 8px 10px; }
  .piece { position: relative; }
  .piece > i { position: absolute; display: block; background-size: 100% 100%; }
  .stand { width: 66px; height: 34px; }
  .stand .shadow { left: 4px; top: 14px; width: 54px; height: 9px; }
  .stand .base { left: 0; top: 0; width: 54px; height: 21px; }
  .stand .rim { left: -1px; top: -2px; width: 56px; height: 25px; }
  .character { width: 26px; height: 22px; }
  .character .shadow { left: 1.5px; top: 7.75px; width: 19px; height: 6px; }
  .character .base { left: 0; top: 0; width: 19px; height: 13.3px; }
  .token { width: 44px; height: 44px; }
  .token .shadow { left: -1px; top: 9px; width: 48px; height: 33px; }
  .token .puck { left: 0; top: 2px; width: 44px; height: 35.2px; }
  .token .rim { left: -2.2px; top: -0.2px; width: 48.4px; height: 39.6px; }
  .token .emblem { left: 7px; top: 7px; width: 16px; height: 16px; background-size: contain; background-repeat: no-repeat; }
  .token b { position: absolute; right: 0; bottom: 0; font-size: 12px; color: #f7ecd1; background: rgba(25,23,22,.94); border-radius: 9px; padding: 1px 5px; }
  .king { width: 30px; height: 34px; }
  .king .shadow { left: 0.5px; top: 11px; width: 32px; height: 20px; }
  .king .puck { left: 0; top: 4px; width: 30px; height: 24px; }
  .king .emblem { left: 7.5px; top: 5px; width: 15px; height: 15px; }
  .mark { width: 58px; height: 18.6px; background-size: 100% 100%; }
  .badge { width: 14px; height: 14px; background-size: contain; display: block; }
  .panel { background: #0e1619; padding: 6px 8px; margin: 8px 10px; align-items: center; }
  .slot { position: relative; width: 40px; height: 40px; border-style: solid; border-width: 12px; border-image-slice: 24 fill; box-sizing: border-box; }
  .coin { width: 18px; height: 18px; background-size: contain; display: block; }
  .ghost { width: 64px; height: 40px; border-style: solid; border-width: 12px; border-image-slice: 24 fill; box-sizing: border-box; opacity: .55; }
</style>
</head>
<body>
<script>
  const art = name => `url('../../../unity/Wotr.Client/Assets/Wotr/Resources/Wotr/Art/UI/${name}.png')`;
  const part = (cls, name) => `<i class="${cls}" style="background-image:${art(name)}"></i>`;
  const stand = (kind, side, rim) => `<div class="piece stand">${part("shadow", "armies/contact-shadow")}` +
    part("base", `armies/stand-${kind}-${side}`) + (rim ? part("rim", `armies/rim-field-rim-${rim}`) : "") + `</div>`;
  const character = side => `<div class="piece character">${part("shadow", "armies/contact-shadow")}` +
    part("base", `armies/stand-character-${side}`) + `</div>`;
  const token = (garrison, side, nation, count, rim) => `<div class="piece token">${part("shadow", "armies/contact-shadow")}` +
    part("puck", `armies/token-puck-${garrison ? "garrison-" : ""}${side}`) + (rim ? part("rim", `armies/rim-token-rim-${rim}`) : "") +
    part("emblem", `icons/nations/${nation}`) + `<b>${count}</b></div>`;
  const king = `<div class="piece king">${part("shadow", "armies/contact-shadow")}${part("puck", "kings/puck-corrupted")}` +
    `${part("emblem", "kings/emblem-corrupted")}</div>`;
  const rows = [
    [stand("field", "free"), stand("garrison", "free", "selected"), stand("field", "shadow", "eligible"),
     stand("garrison", "shadow", "moved"), character("free"), character("shadow"), king],
    [token(false, "free", "rohan", 7), token(true, "free", "gondor", 4), token(false, "shadow", "sauron", 9),
     token(true, "shadow", "isengard", 2), token(false, "free", "elves", 3, "selected"), token(false, "free", "north", 3, "eligible"),
     token(false, "shadow", "southrons", 4, "pressed"), token(false, "shadow", "sauron", 5, "ability"),
     token(false, "free", "dwarves", 2, "moved")],
    [`<div class="mark" style="background-image:${art("armies/landing-mark-landing-move")}"></div>`,
     `<div class="mark" style="background-image:${art("armies/landing-mark-landing-attack")}"></div>`,
     `<i class="badge" style="background-image:${art("armies/moved-check")}"></i>`]
  ];
  document.write(rows.map(row => `<div class="row">${row.join("")}</div>`).join(""));
  document.write(`<div class="row panel"><div class="slot" style="border-image-source:${art("armies/reserve-slot")}"></div>` +
    `<div class="slot" style="border-image-source:${art("armies/reserve-slot-selected")}"></div>` +
    `<div class="slot" style="border-image-source:${art("armies/reserve-slot-pressed")}"></div>` +
    `<i class="coin" style="background-image:${art("armies/budget-slot-filled")}"></i>` +
    `<i class="coin" style="background-image:${art("armies/budget-slot")}"></i>` +
    `<div class="ghost" style="border-image-source:${art("armies/ghost-outline")}"></div></div>`);
</script>
</body>
</html>
