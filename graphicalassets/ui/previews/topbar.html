<!doctype html>
<html>
<head>
<meta charset="utf-8">
<!-- Review composition of the separate UI-86 pieces with the UI-98 corner tab and the UI-100 notice pennants and log icon under the bar; Unity USS (Styles/TopBar.uss) is the real layout. -->
<style>
  html, body { margin: 0; width: 1366px; height: 120px; overflow: hidden; font-family: "Helvetica Neue", Arial, sans-serif; }
  body { background: url("../../maps/terrain-map14/MapTerrain.png") -900px -700px; }
  .topbar { position: relative; height: 44px; display: flex; align-items: center; padding: 0 18px 0 30px; box-sizing: border-box;
    background: url("../../../unity/Wotr.Client/Assets/Wotr/Resources/Wotr/Art/UI/surfaces/topbar-plate.png") repeat-x 0 0 / 168px 100%; }
  .frame { position: absolute; left: 0; right: 0; top: 0; bottom: 0; pointer-events: none;
    border-style: solid; border-width: 20px 52px 20px 52px;
    border-image: url("../../../unity/Wotr.Client/Assets/Wotr/Resources/Wotr/Art/UI/frames/topbar-frame.png") 40 104 40 104 fill stretch; }
  .shadow { height: 8px; background: url("../../../unity/Wotr.Client/Assets/Wotr/Resources/Wotr/Art/UI/surfaces/cast-shadow.png") 0 0 / 100% 100%; }
  .phase { position: relative; color: #ecdcae; font-size: 15px; letter-spacing: .2px; margin-right: 4px; white-space: nowrap; }
  .divider { position: relative; width: 10px; height: 34px; margin: 0 6px; flex-shrink: 0;
    background: url("../../../unity/Wotr.Client/Assets/Wotr/Resources/Wotr/Art/UI/ornaments/divider.png") center / 10px 34px no-repeat; }
  .side { position: relative; color: #c9a964; font-size: 11px; letter-spacing: 1.5px; margin-right: 8px; font-weight: bold; }
  .die { width: 29px; height: 29px; margin-right: 3px; position: relative; flex-shrink: 0;
    background: url("../../../unity/Wotr.Client/Assets/Wotr/Resources/Wotr/Art/UI/dice/medallion-shadow.png") center / 29px 29px; }
  .die i { position: absolute; left: 4px; top: 4px; right: 4px; bottom: 4px; background: center / contain no-repeat; }
  .spacer { flex: 1; }
  .cartouche { position: relative; display: flex; align-items: center; height: 32px; padding: 0 6px; box-sizing: border-box;
    border-style: solid; border-width: 14px; border-image: url("../../../unity/Wotr.Client/Assets/Wotr/Resources/Wotr/Art/UI/frames/cartouche.png") 28 fill stretch; }
  .cartouche-inner { display: flex; align-items: center; margin: -14px -8px; }
  .chip { display: flex; align-items: center; padding: 0 5px; }
  .chip i { width: 22px; height: 22px; margin-right: 4px; background: center / 22px 22px no-repeat; }
  .chip em { font-style: normal; font-weight: bold; font-size: 15px; color: #f1e6c4; }
  .chip-divider { width: 8px; height: 24px; background: url("../../../unity/Wotr.Client/Assets/Wotr/Resources/Wotr/Art/UI/ornaments/divider-small.png") center / 8px 24px no-repeat; }
  .live { position: relative; color: #a8bab8; font-size: 11px; margin: 0 8px; }
  .menu { position: relative; width: 64px; height: 32px; box-sizing: border-box; display: flex; align-items: center; justify-content: center;
    color: #f1e3b5; font-size: 15px; border-style: solid; border-width: 12px;
    border-image: url("../../../unity/Wotr.Client/Assets/Wotr/Resources/Wotr/Art/UI/frames/button.png") 24 fill stretch; }
  .menu span { margin: -12px; }
  .corner { position: absolute; right: 0; top: 44px; width: 380px; height: 46px; box-sizing: border-box;
    border-style: solid; border-width: 22px; border-image: url("../../../unity/Wotr.Client/Assets/Wotr/Resources/Wotr/Art/UI/frames/panel.png") 44 fill stretch; }
  .corner-inner { display: flex; align-items: center; margin: -18px -14px; height: 36px; }
  .plaque { position: relative; height: 36px; display: flex; align-items: center; padding: 0 6px 0 4px; }
  .plaque:first-child { flex: 1; }
  .plaque > .inner { display: flex; align-items: center; width: 100%; }
  .plaque:first-child .text { flex: 1; }
  .divider-small { display: block; width: 8px; height: 30px; margin: 0 4px; background: url("../../../unity/Wotr.Client/Assets/Wotr/Resources/Wotr/Art/UI/ornaments/divider-small.png") center / 8px 30px no-repeat; }
  .sprite { display: block; flex-shrink: 0; background-image: url("../../../unity/Wotr.Client/Assets/Wotr/Resources/Wotr/Art/fellowship-symbols-v1.png"); background-repeat: no-repeat; }
  .text { display: flex; flex-direction: column; margin-left: 5px; }
  .main { color: #f1e6c4; font-size: 13px; font-weight: bold; line-height: 15px; }
  .caption { color: #c9a964; font-size: 9px; font-weight: bold; letter-spacing: 1.2px; line-height: 11px; }
  .values { display: flex; flex-direction: column; margin-left: 8px; }
  .value { display: flex; align-items: center; height: 15px; }
  .value b { margin-left: 3px; color: #f1e6c4; font-size: 12px; }
  .value b.corruption { color: #efa589; }
  .hunt-emblem { width: 28px; height: 28px; background: url("../../../unity/Wotr.Client/Assets/Wotr/Resources/Wotr/Art/UI/icons/hunt.png") center / 26px 26px no-repeat; }
  .eye { position: relative; width: 17px; height: 17px; background: url("../../../unity/Wotr.Client/Assets/Wotr/Resources/Wotr/Art/UI/dice/medallion-shadow.png") center / 17px 17px; }
  .eye i { position: absolute; left: 2px; top: 2px; right: 2px; bottom: 2px; background: url("../../../unity/Wotr.Client/Assets/Wotr/Resources/Wotr/Art/UI/dice/faces/eye.png") center / contain no-repeat; }
  .count { display: flex; align-items: center; }
  .count b { margin-left: 3px; color: #f1e6c4; font-size: 14px; }
  .notices { position: absolute; left: 12px; top: 50px; height: 30px; display: flex; align-items: center; }
  .notices .log { position: relative; width: 28px; height: 28px; margin-right: 6px; box-sizing: border-box; border-style: solid; border-width: 8px;
    border-image: url("../../../unity/Wotr.Client/Assets/Wotr/Resources/Wotr/Art/UI/frames/button-square.png") 16 fill stretch; }
  .notices .log i { position: absolute; left: -4px; top: -4px; width: 20px; height: 20px; background: url("../../../unity/Wotr.Client/Assets/Wotr/Resources/Wotr/Art/UI/icons/log.png") center / 20px 20px no-repeat; }
  .notices .stack { position: relative; width: 42px; height: 30px; }
  .notices .pennant { position: absolute; top: 0; width: 22px; height: 28px; background: url("../../../unity/Wotr.Client/Assets/Wotr/Resources/Wotr/Art/UI/frames/pennant-shadow.png") center / 22px 28px no-repeat; }
  .notices .front { left: 0; }
  .notices .layer1 { left: 5px; top: 1px; filter: brightness(0.7); }
  .notices .layer2 { left: 10px; top: 2px; filter: brightness(0.48); }
  .notices .seal { position: absolute; left: 25px; top: 13px; width: 16px; height: 16px; background: url("../../../unity/Wotr.Client/Assets/Wotr/Resources/Wotr/Art/UI/ornaments/wax-seal.png") center / 16px 16px;
    color: #fae4cd; font-size: 9px; font-weight: bold; text-align: center; line-height: 16px; }
</style>
</head>
<body>
<div class="topbar">
  <div class="frame"></div>
  <div class="phase">Turn 4 · Actions</div>
  <div class="divider"></div>
  <div class="side">SHADOW</div>
  <div class="die"><i style="background-image:url('../../../unity/Wotr.Client/Assets/Wotr/Resources/Wotr/Art/UI/dice/faces/eye.png')"></i></div>
  <div class="die"><i style="background-image:url('../../../unity/Wotr.Client/Assets/Wotr/Resources/Wotr/Art/UI/dice/faces/character.png')"></i></div>
  <div class="die"><i style="background-image:url('../../../unity/Wotr.Client/Assets/Wotr/Resources/Wotr/Art/UI/dice/faces/army.png')"></i></div>
  <div class="die"><i style="background-image:url('../../../unity/Wotr.Client/Assets/Wotr/Resources/Wotr/Art/UI/dice/faces/muster.png')"></i></div>
  <div class="die"><i style="background-image:url('../../../unity/Wotr.Client/Assets/Wotr/Resources/Wotr/Art/UI/dice/faces/event.png')"></i></div>
  <div class="die"><i style="background-image:url('../../../unity/Wotr.Client/Assets/Wotr/Resources/Wotr/Art/UI/dice/faces/army-muster.png')"></i></div>
  <div class="spacer"></div>
  <div class="cartouche"><div class="cartouche-inner">
    <div class="chip"><i style="background-image:url('../../../unity/Wotr.Client/Assets/Wotr/Resources/Wotr/Art/UI/icons/cards.png')"></i><em>6</em></div>
    <div class="chip-divider"></div>
    <div class="chip"><i style="background-image:url('../../../unity/Wotr.Client/Assets/Wotr/Resources/Wotr/Art/UI/icons/ring.png')"></i><em>0</em></div>
    <div class="chip-divider"></div>
    <div class="chip"><i style="background-image:url('../../../unity/Wotr.Client/Assets/Wotr/Resources/Wotr/Art/UI/icons/spent.png')"></i><em>1</em></div>
    <div class="chip-divider"></div>
    <div class="chip"><i style="background-image:url('../../../unity/Wotr.Client/Assets/Wotr/Resources/Wotr/Art/UI/icons/out.png')"></i><em>0</em></div>
  </div></div>
  <div class="live">Live</div>
  <div class="menu"><span>Menu</span></div>
</div>
<div class="shadow"></div>
<div class="notices"><div class="log"><i></i></div>
  <div class="stack"><div class="pennant layer2"></div><div class="pennant layer1"></div><div class="pennant front"></div><div class="seal">3</div></div></div>
<div class="corner"><div class="corner-inner">
  <div class="plaque"><div class="inner">
    <i class="sprite" style="width:28px;height:28px;background-size:160.2px 80.1px;background-position:-86.0px -7.8px;"></i>
    <div class="text"><span class="main">Rivendell</span><span class="caption">Hidden</span></div>
    <div class="values">
      <div class="value"><i class="sprite" style="width:14px;height:14px;background-size:85.6px 42.8px;background-position:-4.4px -4.9px;"></i><b>4</b></div>
      <div class="value"><i class="sprite" style="width:14px;height:14px;background-size:80.9px 40.4px;background-position:-23.3px -4.3px;"></i><b class="corruption">0</b></div>
    </div>
  </div></div>
  <i class="divider-small"></i>
  <div class="plaque"><div class="inner">
    <i class="hunt-emblem"></i>
    <div class="text">
      <div class="count"><div class="eye"><i></i></div><b>2</b><span style="width:7px"></span><i class="sprite" style="width:14px;height:14px;background-size:85.6px 42.8px;background-position:-4.4px -4.9px;"></i><b>1</b></div>
      <span class="caption">Hunt</span>
    </div>
  </div></div>
</div></div>
</body>
</html>
